version: '3.8'

services:
  corebanking-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corebanking-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_HTTP_PORTS=80
    networks:
      - corebanking-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=false"

  nginx:
    image: nginx:1.24-alpine
    container_name: corebanking-nginx
    ports:
      - "8080:80" # HTTP redirect
      - "8443:443" # HTTPS + HTTP/2
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      corebanking-api:
        condition: service_healthy
    networks:
      - corebanking-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-check-certificate", "--no-verbose", "--tries=1", "--spider", "https://localhost:443/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  corebanking-network:
    driver: bridge

volumes:
  nginx-cache:
    driver: local
