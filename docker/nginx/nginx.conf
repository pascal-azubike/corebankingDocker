user  nginx;
worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$server_protocol"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # HTTP backend (port 80)
    upstream corebanking_http {
        server corebanking-api:80 max_fails=3 fail_timeout=30s;
    }

    # gRPC backend (port 5001)
    upstream corebanking_grpc {
        server corebanking-api:5001 max_fails=3 fail_timeout=30s;
    }

    # HTTPS Server with HTTP/2
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL Certificate Paths
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL Security Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # gRPC reflection service (required for grpcui)
        location /grpc.reflection.v1alpha.ServerReflection {
            grpc_pass grpc://corebanking_grpc;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            client_body_timeout 300s;
            grpc_read_timeout 300s;
            grpc_send_timeout 300s;
        }

        # gRPC reflection v1 (newer version)
        location /grpc.reflection.v1.ServerReflection {
            grpc_pass grpc://corebanking_grpc;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            client_body_timeout 300s;
            grpc_read_timeout 300s;
            grpc_send_timeout 300s;
        }

        # Greeter gRPC service
        location /greet.Greeter {
            grpc_pass grpc://corebanking_grpc;

            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            client_body_timeout 300s;
            grpc_read_timeout 300s;
            grpc_send_timeout 300s;
        }

        # Health check endpoint
        location = /health {
            proxy_pass http://corebanking_http/health;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_send_timeout 3s;
            proxy_read_timeout 5s;

            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # V2 Health check endpoint
        location = /v2/health {
            proxy_pass http://corebanking_http/health;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_send_timeout 3s;
            proxy_read_timeout 5s;

            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # Default catch-all route (HTTP)
        location / {
            proxy_pass http://corebanking_http;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }
    }

    # HTTP Server - Redirect to HTTPS
    server {
        listen 80;
        server_name _;

        return 301 https://$host:8443$request_uri;
    }
}
